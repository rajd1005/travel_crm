version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tcc_postgres
    restart: always
    environment:
      POSTGRES_USER: admin_tcc
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: travel_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Host port 5433 maps to container port 5432

  backend:
    build: ./backend
    container_name: tcc_fastapi
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://admin_tcc:SecurePassword123!@db:5432/travel_crm
      - SECRET_KEY=your_super_secret_jwt_key
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: tcc_react
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
